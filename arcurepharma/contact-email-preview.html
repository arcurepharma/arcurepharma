<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Contact Message - PREVIEW</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 10px; background-color: #f5f5f5; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>

  <!-- Preview Banner -->
  <div style="max-width: 480px; margin: 0 auto 10px auto; background: #2d3748; color: #d4fc79; padding: 6px; text-align: center; font-size: 11px; font-weight: 600; border-radius: 4px;">
     ✨ PREVIEW MODE - Super Compact Admin Notification
  </div>

  <!-- SUPER COMPACT CARD -->
  <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 6px; overflow: hidden; border: 1px solid #e2e8f0;">
    
    <!-- Ultra Slim Header -->
    <div style="background: #050616; padding: 10px 15px; border-bottom: 2px solid #d4fc79;">
      <span style="color: #ffffff; font-weight: 800; font-size: 12px; letter-spacing: 1px;">ARCUREPHARMA - NEW INQUIRY</span>
    </div>

    <div style="padding: 15px;">
      
      <!-- Combined Info Row -->
      <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 10px; font-size: 13px;">
        <tr>
          <td style="color: #718096; width: 60px; font-weight: 600;">SENDER:</td>
          <td style="color: #1a202c; font-weight: 600;">John Doe <span style="font-weight:400; opacity:0.7;">&lt;john@example.com&gt;</span></td>
        </tr>
        <tr>
          <td style="color: #718096; font-weight: 600; padding-top: 4px;">SUBJECT:</td>
          <td style="color: #1a202c; font-weight: 600; padding-top: 4px;">Product Inquiry</td>
        </tr>
      </table>

      <!-- Minimal Message Box -->
      <div style="background: #f8fafc; border: 1px solid #edf2f7; border-radius: 4px; padding: 12px; font-size: 13px; color: #4a5568; line-height: 1.4;">
        Hello, I was wondering if you offer international shipping to Dubai? Please let me know the rates for bulk orders.
      </div>

      <!-- Compact Action Area -->
      <div style="margin-top: 12px; text-align: right;">
        <a href="mailto:john@example.com?subject=Re: Product Inquiry" style="background: #1a1c4b; color: #ffffff; padding: 8px 20px; border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 12px; display: inline-block;">
          Reply
        </a>
      </div>

    </div>
  </div>

</body>
</html>
